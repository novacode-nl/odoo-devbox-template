name: Release

# Publishes a GitHub Release whenever a version tag (v*) is pushed, so every
# release tag automatically gets a Release with auto-generated notes. The tag
# also gives Copier a clean template version for `copier update`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create a Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so auto-notes can diff from the previous tag
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
